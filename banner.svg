<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Luiz Gustavo</title>
  <desc id="d">Desenvolvedor Back-End em formação. Python, JavaScript, Java e MySQL.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B14"/>
      <stop offset="0.6" stop-color="#0B1626"/>
      <stop offset="1" stop-color="#102A43"/>
    </linearGradient>

    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22D3EE" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0.55"/>
    </linearGradient>

    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#22D3EE" opacity="0.12"/>
    </pattern>

    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>

    <clipPath id="round"><rect width="1200" height="320" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#dots)"/>
    <ellipse cx="920" cy="160" rx="360" ry="200" fill="url(#glow)"/>
    <rect x="0" y="316" width="1200" height="4" fill="url(#edge)"/>
  </g>
  <rect x="0.75" y="0.75" width="1198.5" height="318.5" rx="17.5" fill="none" stroke="#22D3EE" stroke-opacity="0.18" stroke-width="1.5"/>

  <!-- Texto -->
  <g font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <rect x="80" y="86" width="5" height="132" rx="2.5" fill="#22D3EE"/>

    <text x="110" y="148" font-size="72" font-weight="800" fill="#F5FAFF" letter-spacing="-2">Luiz Gustavo</text>
    <text x="112" y="192" font-size="25" font-weight="400" fill="#9FB3C8">Desenvolvedor Back-End em formação</text>

    <g font-size="18" font-weight="500" fill="#67E8F9">
      <circle cx="116" cy="236" r="3.5" fill="#22D3EE"/>
      <text x="128" y="242">Python</text>
      <circle cx="226" cy="236" r="3.5" fill="#22D3EE"/>
      <text x="238" y="242">JavaScript</text>
      <circle cx="368" cy="236" r="3.5" fill="#22D3EE"/>
      <text x="380" y="242">Java</text>
      <circle cx="456" cy="236" r="3.5" fill="#22D3EE"/>
      <text x="468" y="242">MySQL</text>
    </g>
  </g>

  <!-- Fluxo requisição -> API -> banco -->
  <g>
    <!-- trilhas -->
    <line x1="806" y1="150" x2="884" y2="150" stroke="#22D3EE" stroke-opacity="0.4" stroke-width="2" stroke-dasharray="4 6" stroke-linecap="round"/>
    <line x1="956" y1="150" x2="1034" y2="150" stroke="#22D3EE" stroke-opacity="0.4" stroke-width="2" stroke-dasharray="4 6" stroke-linecap="round"/>

    <!-- pacotes de dados (momento animado único) -->
    <g>
      <circle r="9" fill="#22D3EE" opacity="0.5" filter="url(#blur)">
        <animateMotion dur="3.2s" repeatCount="indefinite" path="M 806 150 L 1034 150" keyPoints="0;1" keyTimes="0;1" calcMode="linear"/>
        <animate attributeName="opacity" values="0;0.7;0.7;0" keyTimes="0;0.1;0.85;1" dur="3.2s" repeatCount="indefinite"/>
      </circle>
      <circle r="4" fill="#E0FBFF">
        <animateMotion dur="3.2s" repeatCount="indefinite" path="M 806 150 L 1034 150" keyPoints="0;1" keyTimes="0;1" calcMode="linear"/>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="3.2s" repeatCount="indefinite"/>
      </circle>
    </g>
    <g>
      <circle r="4" fill="#22D3EE">
        <animateMotion dur="3.2s" begin="1.6s" repeatCount="indefinite" path="M 1034 150 L 806 150" keyPoints="0;1" keyTimes="0;1" calcMode="linear"/>
        <animate attributeName="opacity" values="0;0.8;0.8;0" keyTimes="0;0.1;0.85;1" dur="3.2s" begin="1.6s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- nó 1: cliente -->
    <rect x="734" y="114" width="72" height="72" rx="14" fill="#0A1322" stroke="#22D3EE" stroke-opacity="0.55" stroke-width="1.5"/>
    <text x="770" y="160" text-anchor="middle" font-family="'Fira Code', 'Cascadia Code', Consolas, 'Courier New', monospace" font-size="26" font-weight="600" fill="#22D3EE">&gt;_</text>

    <!-- nó 2: API -->
    <rect x="884" y="114" width="72" height="72" rx="14" fill="#0A1322" stroke="#22D3EE" stroke-width="2"/>
    <text x="920" y="160" text-anchor="middle" font-family="'Fira Code', 'Cascadia Code', Consolas, 'Courier New', monospace" font-size="26" font-weight="600" fill="#F5FAFF">{ }</text>

    <!-- nó 3: banco de dados -->
    <rect x="1034" y="114" width="72" height="72" rx="14" fill="#0A1322" stroke="#22D3EE" stroke-opacity="0.55" stroke-width="1.5"/>
    <g fill="none" stroke="#22D3EE" stroke-width="2" stroke-linecap="round">
      <ellipse cx="1070" cy="136" rx="16" ry="6"/>
      <path d="M1054 136 V164 C1054 168 1061 172 1070 172 C1079 172 1086 168 1086 164 V136"/>
      <path d="M1054 150 C1054 154 1061 158 1070 158 C1079 158 1086 154 1086 150"/>
    </g>

    <!-- legendas -->
    <g font-family="'Fira Code', 'Cascadia Code', Consolas, 'Courier New', monospace" font-size="15" fill="#7D8FA3" text-anchor="middle">
      <text x="770" y="216">request</text>
      <text x="920" y="216">api</text>
      <text x="1070" y="216">mysql</text>
    </g>
  </g>
</svg>
